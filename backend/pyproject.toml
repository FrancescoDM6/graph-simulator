[project]
name = "graphsim"
version = "0.1.0"
description = "A simulation whose world is an evolving graph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "networkx>=3.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

# graphsim is installed into the venv (editable: edits take effect at once), so its commands
# work from any folder: `uv run --project backend python -m graphsim.query ...`.
[tool.uv.build-backend]
module-root = ""  # the package is backend/graphsim (not src/graphsim)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
